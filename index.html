<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Rendement — suivi de rentabilité immobilière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdfcfa;
    --surface: #f3f1eb;
    --surface-2: #eae6dc;
    --border: #dad4c6;
    --text: #211e18;
    --text-dim: #756c5b;
    --accent: #9c6f2b;
    --accent-dim: #c3985a;
    --good: #2f7d54;
    --bad: #b6432f;
    --radius: 10px;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }
  h1,h2,h3{ font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
  .num{ font-family: 'IBM Plex Mono', monospace; }
  button{ font-family: inherit; }
  a{ color: var(--accent); }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 22px 20px 16px;
    max-width: 880px;
    margin: 0 auto;
  }
  header.top h1{ font-size: 1.5rem; letter-spacing: 0.2px; }
  header.top .sub{ color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }

  .btn{
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 9px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.9rem;
    transition: border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color: var(--accent-dim); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fdfcfa;
    font-weight: 500;
  }
  .btn.primary:hover{ background: var(--accent-dim); }
  .btn.ghost{ background: transparent; }
  .btn.danger{ color: var(--bad); border-color: var(--border); background: transparent; }
  .btn.danger:hover{ border-color: var(--bad); }
  .btn.small{ padding: 6px 11px; font-size: 0.8rem; }

  main{ max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* Project switcher */
  .project-rail{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 18px;
    scrollbar-width: none;
  }
  .project-rail::-webkit-scrollbar{ display:none; }
  .project-chip{
    flex: 0 0 auto;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.88rem;
    white-space: nowrap;
  }
  .project-chip.active{
    border-color: var(--accent);
    color: var(--text);
    background: var(--surface-2);
  }
  .project-chip .new-icon{ color: var(--accent); margin-right: 4px; }

  .empty-state{
    text-align:center;
    padding: 70px 20px;
    color: var(--text-dim);
  }
  .empty-state h2{ color: var(--text); font-size: 1.3rem; margin-bottom: 8px; }
  .empty-state .btn{ margin-top: 18px; }

  /* Summary card */
  .summary{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .summary-title{
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .summary-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 20px;
  }
  @media(min-width: 560px){
    .summary-grid{ grid-template-columns: repeat(4, 1fr); }
  }
  .metric .val{
    font-size: 1.3rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }
  .metric .val.good{ color: var(--good); }
  .metric .val.bad{ color: var(--bad); }
  .metric .lbl{ color: var(--text-dim); font-size: 0.78rem; margin-top: 3px; }

  /* Tabs */
  .tabs{
    display:flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    gap: 4px;
  }
  .tab-btn{
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 10px 4px;
    margin-right: 22px;
    font-size: 0.92rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    position: relative;
    top: 1px;
  }
  .tab-btn.active{
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation: fade .15s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }

  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline: none;
    border-color: var(--accent-dim);
  }
  .field textarea{
    resize: vertical;
    line-height: 1.5;
    font-family: inherit;
  }
  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .hint{ font-size: 0.76rem; color: var(--text-dim); margin-top: 5px; }

  /* Travaux detail rows */
  .detail-list{ margin: 6px 0 18px; }
  .detail-row{
    display:grid;
    grid-template-columns: 1fr 120px 34px;
    gap: 8px;
    margin-bottom: 8px;
    align-items:center;
  }
  .detail-row input{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 0.88rem;
  }
  .row-remove{
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 6px;
  }
  .row-remove:hover{ color: var(--bad); }
  .add-row-btn{
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    width: 100%;
  }
  .add-row-btn:hover{ border-color: var(--accent-dim); color: var(--text); }

  .section-total{
    display:flex;
    justify-content: space-between;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--text-dim);
  }
  .section-total .num{ color: var(--text); }

  .footer-actions{
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display:flex;
    justify-content: flex-end;
  }

  .link-line{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: -2px;
  }
  .link-line a{ font-size: 0.82rem; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Rendement</h1>
    <div class="sub">Suivi de rentabilité de tes projets immobiliers</div>
  </div>
</header>

<main>
  <div class="project-rail" id="projectRail"></div>
  <div id="content"></div>
</main>

<script>
const STORAGE_KEY = 'rendement.projects.v1';

function loadProjects(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveProjects(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.projects));
}

function blankProject(){
  return {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    // Onglet 1 — Infos
    adresse: '',
    surface: '',
    lien: '',
    pieces: '',
    dpe: '',
    prixAchat: '',
    fraisAnnexes: '',
    detailAppartement: '',
    quartierAvantageux: '',
    // Onglet 2 — Travaux
    estimationTravaux: '',
    detailTravaux: [],
    // Onglet 3 — Financement
    sommeEmpruntee: '',
    tauxInteret: '',
    dureePret: '',
    loyer: '',
    chargesMensuelles: '',
    nombreLocataires: ''
  };
}

const state = {
  projects: loadProjects(),
  currentId: null,
  currentTab: 'infos'
};
if(state.projects.length){ state.currentId = state.projects[0].id; }

function currentProject(){
  return state.projects.find(p => p.id === state.currentId) || null;
}

function num(v){
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function fmtEUR(n){
  return n.toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' €';
}
function fmtPct(n){
  return n.toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' %';
}

function detailTotal(p){
  return (p.detailTravaux || []).reduce((s, r) => s + num(r.montant), 0);
}
function travauxTotal(p){
  return num(p.estimationTravaux) + detailTotal(p);
}
function coutTotal(p){
  return num(p.prixAchat) + num(p.fraisAnnexes) + travauxTotal(p);
}
// Coût affiché dans le résumé : travaux + prix d'achat (onglet Infos).
function coutTotalResume(p){
  return travauxTotal(p) + num(p.prixAchat);
}
function mensualite(p){
  const C = num(p.sommeEmpruntee);
  const t = num(p.tauxInteret) / 100 / 12;
  const n = num(p.dureePret) * 12;
  if(C <= 0 || n <= 0) return 0;
  if(t === 0) return C / n;
  return C * t / (1 - Math.pow(1 + t, -n));
}
function cashflowMensuel(p){
  return num(p.loyer) - mensualite(p) - num(p.chargesMensuelles);
}
function rentabiliteNette(p){
  const ct = coutTotal(p);
  if(ct <= 0) return 0;
  const loyerNetAnnuel = (num(p.loyer) - num(p.chargesMensuelles)) * 12;
  return (loyerNetAnnuel / ct) * 100;
}
function apportNecessaire(p){
  return coutTotal(p) - num(p.sommeEmpruntee);
}
// Nombre d'années pour récupérer l'apport personnel via le cash-flow mensuel.
// null = jamais atteint avec un cash-flow négatif ou nul.
function anneesRetour(p){
  const apport = apportNecessaire(p);
  const cfAnnuel = cashflowMensuel(p) * 12;
  if(apport <= 0) return 0;
  if(cfAnnuel <= 0) return null;
  return apport / cfAnnuel;
}

// Projection du cash-flow cumulé, année par année, sur `years` ans.
// Le point 0 correspond à l'apport initial investi (valeur négative).
// La mensualité de crédit s'arrête une fois la durée du prêt écoulée.
function projectionCashflow(p, years){
  years = years || 25;
  const apport = apportNecessaire(p);
  const loyerAnnuel = num(p.loyer) * 12;
  const chargesAnnuelles = num(p.chargesMensuelles) * 12;
  const mensuAnnuelle = mensualite(p) * 12;
  const dureeAns = num(p.dureePret);

  const points = [{ year: 0, value: -apport }];
  let cumul = -apport;
  for(let y = 1; y <= years; y++){
    const empruntActif = dureeAns > 0 && y <= dureeAns;
    const cfAnnee = loyerAnnuel - chargesAnnuelles - (empruntActif ? mensuAnnuelle : 0);
    cumul += cfAnnee;
    points.push({ year: y, value: cumul });
  }
  return points;
}

function projectLabel(p){
  return p.adresse && p.adresse.trim() ? p.adresse.trim() : 'Projet sans adresse';
}

function renderRail(){
  const rail = document.getElementById('projectRail');
  rail.innerHTML = '';
  state.projects.forEach(p => {
    const chip = document.createElement('button');
    chip.className = 'project-chip' + (p.id === state.currentId ? ' active' : '');
    chip.textContent = projectLabel(p);
    chip.onclick = () => { state.currentId = p.id; render(); };
    rail.appendChild(chip);
  });
  const addChip = document.createElement('button');
  addChip.className = 'project-chip';
  addChip.innerHTML = '<span class="new-icon">+</span>Nouveau projet';
  addChip.onclick = () => {
    const p = blankProject();
    state.projects.unshift(p);
    state.currentId = p.id;
    state.currentTab = 'infos';
    saveProjects();
    render();
  };
  rail.appendChild(addChip);
}

function field(labelText, value, onInput, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lbl = document.createElement('label');
  lbl.textContent = labelText;
  wrap.appendChild(lbl);

  let input;
  if(opts.select){
    input = document.createElement('select');
    opts.select.forEach(optVal => {
      const o = document.createElement('option');
      o.value = optVal;
      o.textContent = optVal;
      if(optVal === value) o.selected = true;
      input.appendChild(o);
    });
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = '—';
    empty.selected = !value;
    input.prepend(empty);
  } else if(opts.textarea){
    input = document.createElement('textarea');
    input.rows = opts.rows || 4;
    input.value = value || '';
    if(opts.placeholder) input.placeholder = opts.placeholder;
  } else {
    input = document.createElement('input');
    input.type = opts.type || 'text';
    if(opts.inputmode) input.inputMode = opts.inputmode;
    input.value = value || '';
    if(opts.placeholder) input.placeholder = opts.placeholder;
  }
  input.oninput = (e) => { onInput(e.target.value); saveProjects(); renderSummaryOnly(); };
  wrap.appendChild(input);

  if(opts.hint){
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = opts.hint;
    wrap.appendChild(h);
  }
  return wrap;
}

function renderSummaryOnly(){
  const p = currentProject();
  if(!p) return;
  const box = document.getElementById('summaryBox');
  if(box) box.replaceWith(buildSummary(p));
}

function buildSummary(p){
  const box = document.createElement('div');
  box.className = 'summary';
  box.id = 'summaryBox';

  const title = document.createElement('div');
  title.className = 'summary-title';
  title.textContent = 'Rentabilité estimée';
  box.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'summary-grid';

  const cf = cashflowMensuel(p);
  const retour = anneesRetour(p);
  let retourVal, retourCls;
  if(retour === null){ retourVal = 'Non atteint'; retourCls = 'bad'; }
  else if(retour === 0){ retourVal = 'Immédiat'; retourCls = 'good'; }
  else { retourVal = retour.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' ans'; retourCls = ''; }

  const metrics = [
    { lbl: 'Coût total (travaux + prix d\u2019achat)', val: fmtEUR(coutTotalResume(p)), cls: '' },
    { lbl: 'Retour sur investissement', val: retourVal, cls: retourCls },
    { lbl: 'Loyer mensuel prévu', val: fmtEUR(num(p.loyer)), cls: '' },
    { lbl: 'Cash-flow mensuel', val: fmtEUR(cf), cls: cf >= 0 ? 'good' : 'bad' },
  ];
  metrics.forEach(m => {
    const cell = document.createElement('div');
    cell.className = 'metric';
    cell.innerHTML = `<div class="val ${m.cls} num">${m.val}</div><div class="lbl">${m.lbl}</div>`;
    grid.appendChild(cell);
  });
  box.appendChild(grid);
  return box;
}

function renderTabs(container, p){
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  const defs = [
    { id: 'infos', label: 'Infos' },
    { id: 'travaux', label: 'Travaux' },
    { id: 'financement', label: 'Financement' },
    { id: 'analyse', label: 'Analyse' }
  ];
  defs.forEach(d => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.currentTab === d.id ? ' active' : '');
    b.textContent = d.label;
    b.onclick = () => { state.currentTab = d.id; render(); };
    tabs.appendChild(b);
  });
  container.appendChild(tabs);
}

function renderInfos(container, p){
  const panel = document.createElement('div');
  panel.className = 'panel active';

  panel.appendChild(field('Adresse', p.adresse, v => p.adresse = v, { placeholder: '12 rue des Lilas, Lyon' }));

  const row1 = document.createElement('div');
  row1.className = 'field-row';
  row1.appendChild(field('Surface (m²)', p.surface, v => p.surface = v, { type: 'number', inputmode: 'decimal' }));
  row1.appendChild(field('Nombre de pièces', p.pieces, v => p.pieces = v, { type: 'number', inputmode: 'numeric' }));
  panel.appendChild(row1);

  const row2 = document.createElement('div');
  row2.className = 'field-row';
  row2.appendChild(field('DPE', p.dpe, v => p.dpe = v, { select: ['A','B','C','D','E','F','G'] }));
  row2.appendChild(field('Prix d\u2019achat (€)', p.prixAchat, v => p.prixAchat = v, { type: 'number', inputmode: 'decimal' }));
  panel.appendChild(row2);

  panel.appendChild(field('Frais annexes — notaire, agence... (€)', p.fraisAnnexes, v => p.fraisAnnexes = v, { type: 'number', inputmode: 'decimal', hint: 'Optionnel, inclus dans le coût total du projet.' }));

  panel.appendChild(field('Quartier avantageux', p.quartierAvantageux, v => p.quartierAvantageux = v, { select: ['Oui', 'Non'] }));

  panel.appendChild(field('Détail de l\u2019appartement', p.detailAppartement, v => p.detailAppartement = v, { textarea: true, rows: 5, placeholder: 'Agencement, état général, exposition, vue, copropriété...' }));

  panel.appendChild(field('Lien de l\u2019annonce', p.lien, v => p.lien = v, { placeholder: 'https://...' }));
  if(p.lien){
    const line = document.createElement('div');
    line.className = 'link-line';
    line.innerHTML = `<a href="${p.lien}" target="_blank" rel="noopener">Ouvrir l\u2019annonce →</a>`;
    panel.appendChild(line);
  }

  container.appendChild(panel);
}

function renderTravaux(container, p){
  const panel = document.createElement('div');
  panel.className = 'panel active';

  panel.appendChild(field('Estimation globale des travaux (€)', p.estimationTravaux, v => p.estimationTravaux = v, {
    type: 'number', inputmode: 'decimal',
    hint: 'S\u2019ajoute au détail ci-dessous pour former le total retenu.'
  }));

  const listLabel = document.createElement('label');
  listLabel.textContent = 'Détail des travaux';
  listLabel.style.display = 'block';
  listLabel.style.fontSize = '0.82rem';
  listLabel.style.color = 'var(--text-dim)';
  listLabel.style.marginBottom = '8px';
  panel.appendChild(listLabel);

  const list = document.createElement('div');
  list.className = 'detail-list';

  if(!p.detailTravaux) p.detailTravaux = [];

  p.detailTravaux.forEach((row, idx) => {
    const r = document.createElement('div');
    r.className = 'detail-row';

    const libelle = document.createElement('input');
    libelle.type = 'text';
    libelle.placeholder = 'Ex : Cuisine, Salle de bain, Peinture...';
    libelle.value = row.libelle || '';
    libelle.oninput = e => { row.libelle = e.target.value; saveProjects(); };

    const montant = document.createElement('input');
    montant.type = 'number';
    montant.inputMode = 'decimal';
    montant.placeholder = '€';
    montant.value = row.montant || '';
    montant.oninput = e => { row.montant = e.target.value; saveProjects(); renderSummaryOnly(); updateTravauxTotal(p); };

    const remove = document.createElement('button');
    remove.className = 'row-remove';
    remove.textContent = '✕';
    remove.onclick = () => {
      p.detailTravaux.splice(idx, 1);
      saveProjects();
      render();
    };

    r.appendChild(libelle);
    r.appendChild(montant);
    r.appendChild(remove);
    list.appendChild(r);
  });

  panel.appendChild(list);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-row-btn';
  addBtn.textContent = '+ Ajouter une ligne de travaux';
  addBtn.onclick = () => {
    p.detailTravaux.push({ libelle: '', montant: '' });
    saveProjects();
    render();
  };
  panel.appendChild(addBtn);

  const total = document.createElement('div');
  total.className = 'section-total';
  total.id = 'travauxTotalLine';
  total.innerHTML = `<span>Total travaux retenu</span><span class="num">${fmtEUR(travauxTotal(p))}</span>`;
  panel.appendChild(total);

  container.appendChild(panel);
}

function updateTravauxTotal(p){
  const line = document.getElementById('travauxTotalLine');
  if(line) line.innerHTML = `<span>Total travaux retenu</span><span class="num">${fmtEUR(travauxTotal(p))}</span>`;
}

function renderFinancement(container, p){
  const panel = document.createElement('div');
  panel.className = 'panel active';

  panel.appendChild(field('Somme empruntée (€)', p.sommeEmpruntee, v => p.sommeEmpruntee = v, { type: 'number', inputmode: 'decimal' }));

  const row1 = document.createElement('div');
  row1.className = 'field-row';
  row1.appendChild(field('Taux d\u2019intérêt annuel (%)', p.tauxInteret, v => p.tauxInteret = v, { type: 'number', inputmode: 'decimal', placeholder: '3.5' }));
  row1.appendChild(field('Durée du prêt (années)', p.dureePret, v => p.dureePret = v, { type: 'number', inputmode: 'numeric', placeholder: '20' }));
  panel.appendChild(row1);

  const row2b = document.createElement('div');
  row2b.className = 'field-row';
  row2b.appendChild(field('Loyer mensuel prévu (€)', p.loyer, v => p.loyer = v, { type: 'number', inputmode: 'decimal' }));
  row2b.appendChild(field('Nombre de locataires', p.nombreLocataires, v => p.nombreLocataires = v, { type: 'number', inputmode: 'numeric' }));
  panel.appendChild(row2b);

  panel.appendChild(field('Charges mensuelles — copro, taxe foncière/12, assurance... (€)', p.chargesMensuelles, v => p.chargesMensuelles = v, { type: 'number', inputmode: 'decimal', hint: 'Optionnel, affine le cash-flow et la rentabilité nette.' }));

  const total = document.createElement('div');
  total.className = 'section-total';
  total.innerHTML = `<span>Mensualité de crédit estimée</span><span class="num">${fmtEUR(mensualite(p))}</span>`;
  panel.appendChild(total);

  const total2 = document.createElement('div');
  total2.className = 'section-total';
  total2.innerHTML = `<span>Apport nécessaire</span><span class="num">${fmtEUR(apportNecessaire(p))}</span>`;
  panel.appendChild(total2);

  container.appendChild(panel);
}

function buildCashflowChart(points){
  const W = 680, H = 280;
  const padL = 66, padR = 16, padT = 16, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const values = points.map(pt => pt.value);
  let minV = Math.min(0, ...values);
  let maxV = Math.max(0, ...values);
  if(minV === maxV){ minV -= 1; maxV += 1; }
  const spread = maxV - minV;
  minV -= spread * 0.08;
  maxV += spread * 0.08;

  const maxYear = points[points.length - 1].year;
  const x = (year) => padL + (year / maxYear) * plotW;
  const y = (val) => padT + (1 - (val - minV) / (maxV - minV)) * plotH;

  const linePath = points.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${x(pt.year).toFixed(1)} ${y(pt.value).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${x(maxYear).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

  // Point de bascule : première année où le cumul devient positif.
  let breakeven = null;
  for(let i = 1; i < points.length; i++){
    if(points[i - 1].value < 0 && points[i].value >= 0){
      const p0 = points[i - 1], p1 = points[i];
      const ratio = (0 - p0.value) / (p1.value - p0.value);
      breakeven = p0.year + ratio;
      break;
    }
  }

  const yearTicks = [];
  const step = maxYear <= 10 ? 1 : 5;
  for(let yr = 0; yr <= maxYear; yr += step) yearTicks.push(yr);

  const valueTicks = [minV + spread * 0.08, minV + (maxV - minV) / 2, maxV - spread * 0.08];

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">`;

  // grille horizontale + labels y
  valueTicks.forEach(v => {
    const yy = y(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<text x="${padL - 10}" y="${(+yy + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-dim)">${Math.round(v).toLocaleString('fr-FR')} €</text>`;
  });

  // ligne zéro
  const y0 = y(0).toFixed(1);
  svg += `<line x1="${padL}" y1="${y0}" x2="${W - padR}" y2="${y0}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3 3"/>`;

  // labels x
  yearTicks.forEach(yr => {
    svg += `<text x="${x(yr).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--text-dim)">${yr}</text>`;
  });

  // aire + ligne
  svg += `<path d="${areaPath}" fill="var(--accent)" opacity="0.12" stroke="none"/>`;
  svg += `<path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;

  // marqueur de bascule
  if(breakeven !== null){
    const bx = x(breakeven).toFixed(1), by = y(0).toFixed(1);
    svg += `<circle cx="${bx}" cy="${by}" r="4.5" fill="var(--good)" stroke="var(--bg)" stroke-width="2"/>`;
  }

  svg += `</svg>`;
  return svg;
}

function renderAnalyse(container, p){
  const panel = document.createElement('div');
  panel.className = 'panel active';

  const nette = document.createElement('div');
  nette.className = 'metric';
  nette.style.marginBottom = '22px';
  nette.innerHTML = `<div class="val num">${fmtPct(rentabiliteNette(p))}</div><div class="lbl">Rentabilité nette (approx.)</div>`;
  panel.appendChild(nette);

  const chartLabel = document.createElement('label');
  chartLabel.textContent = 'Flux de trésorerie cumulés sur 25 ans';
  chartLabel.style.display = 'block';
  chartLabel.style.fontSize = '0.82rem';
  chartLabel.style.color = 'var(--text-dim)';
  chartLabel.style.marginBottom = '10px';
  panel.appendChild(chartLabel);

  const points = projectionCashflow(p, 25);
  const chartWrap = document.createElement('div');
  chartWrap.innerHTML = buildCashflowChart(points);
  panel.appendChild(chartWrap);

  const breakevenPt = points.find((pt, i) => i > 0 && points[i - 1].value < 0 && pt.value >= 0);
  const note = document.createElement('div');
  note.className = 'hint';
  note.style.marginTop = '10px';
  if(breakevenPt || points[0].value >= 0){
    note.textContent = 'Le point vert marque l\u2019année où l\u2019apport initial est récupéré. Projection à loyer, charges et taux constants ; la mensualité s\u2019arrête à la fin du prêt.';
  } else {
    note.textContent = 'Avec ces hypothèses, l\u2019apport initial n\u2019est pas récupéré sur 25 ans via le cash-flow seul. Projection à loyer, charges et taux constants ; la mensualité s\u2019arrête à la fin du prêt.';
  }
  panel.appendChild(note);

  container.appendChild(panel);
}

function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const p = currentProject();

  if(!p){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <h2>Aucun projet pour l\u2019instant</h2>
      <div>Ajoute ton premier projet immobilier pour commencer à calculer sa rentabilité.</div>
    `;
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = '+ Créer un projet';
    btn.onclick = () => {
      const np = blankProject();
      state.projects.unshift(np);
      state.currentId = np.id;
      saveProjects();
      render();
    };
    empty.appendChild(btn);
    content.appendChild(empty);
    return;
  }

  content.appendChild(buildSummary(p));
  renderTabs(content, p);

  if(state.currentTab === 'infos') renderInfos(content, p);
  if(state.currentTab === 'travaux') renderTravaux(content, p);
  if(state.currentTab === 'financement') renderFinancement(content, p);
  if(state.currentTab === 'analyse') renderAnalyse(content, p);

  const footer = document.createElement('div');
  footer.className = 'footer-actions';
  const del = document.createElement('button');
  del.className = 'btn danger small';
  del.textContent = 'Supprimer ce projet';
  del.onclick = () => {
    if(confirm('Supprimer définitivement ce projet ?')){
      state.projects = state.projects.filter(x => x.id !== p.id);
      state.currentId = state.projects.length ? state.projects[0].id : null;
      saveProjects();
      render();
    }
  };
  footer.appendChild(del);
  content.appendChild(footer);
}

function render(){
  renderRail();
  renderContent();
}

render();
</script>
